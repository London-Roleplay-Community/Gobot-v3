name: CI

on:
  push:
    branches: ["main"]
  pull_request: 
    branches: ["main"]

jobs:
  build:
    name: Test deps & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and setup Go
        uses: actions/setup-go@v6
        with: 
          go-version: stable

      - name: Examination
        run: go vet ./...
      
      - name: Build
        run: go build -v ./...